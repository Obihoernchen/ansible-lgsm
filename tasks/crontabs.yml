---
- name: Create cron log directory
  ansible.builtin.file:
    path: "{{ lgsm_installdir }}/log/cron"
    state: directory
    mode: "0755"
    owner: "{{ lgsm_user }}"
    group: "{{ lgsm_group }}"

# systemd restarts crashed servers (Restart = always), inside its sandbox
- name: Remove cron to monitor server health
  ansible.builtin.cron:
    name: lgsm monitoring crontab
    user: "{{ lgsm_user }}"
    cron_file: lgsm-crontabs
    state: absent

- name: Cron to update lgsm
  ansible.builtin.cron:
    name: lgsm update cron
    weekday: "0"
    minute: "0"
    hour: "3"
    user: "{{ lgsm_user }}"
    job: "{{ lgsm_installdir }}/{{ lgsm_server }} update-lgsm >> {{ lgsm_installdir }}/log/cron/{{ lgsm_server }}-update-lgsm.log 2>&1"
    cron_file: lgsm-crontabs

# Replaced by the update timer, which restarts the server through systemd
- name: Remove cron to update gameserver
  ansible.builtin.cron:
    name: gameserver update cron
    user: "{{ lgsm_user }}"
    cron_file: lgsm-crontabs
    state: absent
